<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fitness Chatbot</title>

  <!-- ✅ Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-image: url('../assets/img/portfolio/gym.jpg'); /* Update if needed */
      background-size: cover;
      background-position: center;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #chat-container {
      width: 400px;
      height: 500px;
      background-color: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat-header {
      background-color: #2196f3;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    #messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .message {
      margin: 10px 0;
      padding: 10px 15px;
      border-radius: 15px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .user {
      background-color: #dcf8c6;
      align-self: flex-end;
      text-align: right;
    }

    .bot {
      background-color: #f1f0f0;
      align-self: flex-start;
      text-align: left;
    }

    #input-box {
      display: flex;
      border-top: 1px solid #ccc;
    }

    #input {
      flex: 1;
      padding: 10px;
      border: none;
      font-size: 16px;
    }

    #send-btn {
      padding: 10px 20px;
      background-color: #2196f3;
      color: white;
      border: none;
      cursor: pointer;
    }

    #send-btn:disabled {
      background-color: #9ecdf2;
      cursor: not-allowed;
    }

    .loading-dots {
      display: inline-block;
    }

    .loading-dots span {
      animation: blink 1s infinite;
    }

    .loading-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loading-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }
  </style>
</head>
<body>

<div id="chat-container">
  <div id="chat-header">🤖 Fitness Chatbot</div>
  <div id="messages"></div>
  <div id="input-box">
    <input id="input" type="text" placeholder="Ask about fitness..." />
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send-btn");
  const messages = document.getElementById("messages");

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    // Show user message
    appendMessage(text, "user");
    input.value = "";
    sendBtn.disabled = true;

    // Add loading message
    const loadingElem = appendMessage('<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>', "bot");

    try {
      const res = await fetch("https://lalit1997-test-api.hf.space/fitnessbot", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          text: text,
          token: "AIzaSyB3wI2r6ZgQnYQ3V39PX5S0zWSRqy5ldYw_Lalit" // Replace with real token
        })
      });

      const data = await res.json();
      loadingElem.remove();
      appendMessage(data.result, "bot");
    } catch (err) {
      loadingElem.remove();
      appendMessage("⚠️ Error connecting to chatbot.", "bot");
    } finally {
      sendBtn.disabled = false;
    }
  }

  function appendMessage(text, sender) {
    const msgDiv = document.createElement("div");
    msgDiv.className = `message ${sender}`;

    if (sender === "bot") {
      msgDiv.innerHTML = marked.parse(text);
    } else {
      msgDiv.textContent = text;
    }

    messages.appendChild(msgDiv);
    messages.scrollTop = messages.scrollHeight;
    return msgDiv;
  }

  input.addEventListener("keypress", (e) => {
    if (e.key === "Enter" && !sendBtn.disabled) sendMessage();
  });
</script>

</body>
</html>
